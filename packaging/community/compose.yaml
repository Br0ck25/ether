# Host networking preserves Plex GDM discovery. Linux host required.
# Choose a release tag or image digest before production use.
services:
  ether:
    image: ghcr.io/braedonsaunders/ether:${ETHER_VERSION:-latest}
    container_name: ether
    network_mode: host
    restart: unless-stopped
    environment:
      ETHER_DATA_DIR: /config
      TZ: ${TZ:-Etc/UTC}
      # Owner of /config and /cache; the container hands both to this user.
      PUID: ${PUID:-999}
      PGID: ${PGID:-999}
    volumes:
      - ${ETHER_CONFIG:-/var/lib/ether}:/config
      - ${ETHER_CACHE:-/var/cache/ether}:/cache
      # Optional hybrid library; add /media in Libraries. Keep media read-only.
      # - /mnt/media:/media:ro
    # Intel/AMD VAAPI: the render node's group is added automatically.
    # devices:
    #   - /dev/dri:/dev/dri
    stop_grace_period: 30s
