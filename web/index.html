<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Ether</title>
    <script>
      // Dark is the default; the owner can switch to light from the header.
      // Runs before paint so there is no flash of the wrong theme.
      (function () {
        var key = "ether-theme";
        var theme = "dark";
        try {
          theme = localStorage.getItem(key) === "light" ? "light" : "dark";
          localStorage.setItem(key, theme);
        } catch (_) {}
        var el = document.documentElement;
        el.classList.toggle("dark", theme === "dark");
        el.classList.toggle("light", theme === "light");
      })();
    </script>
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
